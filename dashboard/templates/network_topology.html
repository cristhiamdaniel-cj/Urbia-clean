<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topología de Red - UrbIA IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #network-canvas {
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #16213e 0%, #0f0f1e 100%);
            border-radius: 10px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <a href="/" class="btn btn-primary back-button">
        <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </a>

    <div class="legend">
        <h5>Leyenda</h5>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff6b6b;"></div>
            <span>Sensores IoT</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #4ecdc4;"></div>
            <span>Gateways Edge</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffe66d;"></div>
            <span>Controlador SDN</span>
        </div>
        <div class="legend-item">
            <div style="width: 20px; height: 2px; background: #51cf66; margin-right: 10px;"></div>
            <span>Paquetes Normal</span>
        </div>
        <div class="legend-item">
            <div style="width: 20px; height: 2px; background: #ff6b6b; margin-right: 10px;"></div>
            <span>Paquetes Crítico</span>
        </div>
    </div>

    <canvas id="network-canvas"></canvas>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');

        // Ajustar canvas al tamaño de la ventana
        function resizeCanvas() {
            canvas.width = window.innerWidth - 40;
            canvas.height = window.innerHeight - 40;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Nodos de la red
        const nodes = {
            controller: { x: canvas.width / 2, y: 100, radius: 30, color: '#ffe66d', label: 'SDN Controller' },
            gateway1: { x: canvas.width / 3, y: 300, radius: 25, color: '#4ecdc4', label: 'Gateway Norte' },
            gateway2: { x: (canvas.width / 3) * 2, y: 300, radius: 25, color: '#4ecdc4', label: 'Gateway Sur' },
            sensors: []
        };

        // Posicionar sensores en círculo alrededor de los gateways
        const sensorNames = ['NOISE-001', 'TEMP-001', 'TRAFFIC-001', 'AIR-001', 'LIGHT-001'];
        sensorNames.forEach((name, i) => {
            const angle = (i / sensorNames.length) * Math.PI * 2;
            const gateway = i < 3 ? nodes.gateway1 : nodes.gateway2;
            nodes.sensors.push({
                x: gateway.x + Math.cos(angle) * 150,
                y: gateway.y + Math.sin(angle) * 150 + 200,
                radius: 15,
                color: '#ff6b6b',
                label: name,
                gateway: i < 3 ? 'gateway1' : 'gateway2',
                critical: Math.random() > 0.7
            });
        });

        // Partículas para simular flujo de datos
        const particles = [];

        class Packet {
            constructor(from, to, critical = false) {
                this.x = from.x;
                this.y = from.y;
                this.targetX = to.x;
                this.targetY = to.y;
                this.progress = 0;
                this.critical = critical;
                this.speed = 0.02;
            }

            update() {
                this.progress += this.speed;
                this.x = this.x + (this.targetX - this.x) * this.speed;
                this.y = this.y + (this.targetY - this.y) * this.speed;
                return this.progress >= 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.critical ? '#ff6b6b' : '#51cf66';
                ctx.fill();
            }
        }

        // Generar paquetes periódicamente
        setInterval(() => {
            nodes.sensors.forEach(sensor => {
                const gateway = nodes[sensor.gateway];
                particles.push(new Packet(sensor, gateway, sensor.critical));
                particles.push(new Packet(gateway, nodes.controller, sensor.critical));
            });
        }, 1000);

        // Dibujar conexiones
        function drawConnection(from, to, active = false) {
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.strokeStyle = active ? 'rgba(81, 207, 102, 0.6)' : 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = active ? 2 : 1;
            ctx.stroke();
        }

        // Dibujar nodo
        function drawNode(node) {
            // Halo
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius + 5, 0, Math.PI * 2);
            ctx.fillStyle = node.color + '33';
            ctx.fill();

            // Nodo principal
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fillStyle = node.color;
            ctx.fill();

            // Borde
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Label
            ctx.fillStyle = 'white';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(node.label, node.x, node.y + node.radius + 20);
        }

        // Loop de animación
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar conexiones
            nodes.sensors.forEach(sensor => {
                const gateway = nodes[sensor.gateway];
                drawConnection(sensor, gateway);
                drawConnection(gateway, nodes.controller);
            });

            // Actualizar y dibujar partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const done = particles[i].update();
                particles[i].draw();
                if (done) particles.splice(i, 1);
            }

            // Dibujar nodos
            drawNode(nodes.controller);
            drawNode(nodes.gateway1);
            drawNode(nodes.gateway2);
            nodes.sensors.forEach(sensor => drawNode(sensor));

            requestAnimationFrame(animate);
        }

        animate();

        // Actualizar estado de sensores desde API
        setInterval(() => {
            fetch('/api/telemetry/current')
                .then(res => res.json())
                .then(data => {
                    data.forEach((item, i) => {
                        if (nodes.sensors[i]) {
                            nodes.sensors[i].critical = item.is_critical;
                            nodes.sensors[i].color = item.is_critical ? '#ff3333' : '#ff6b6b';
                        }
                    });
                });
        }, 2000);
    </script>
</body>
</html>
